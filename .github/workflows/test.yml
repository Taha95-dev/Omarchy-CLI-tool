name: Test Omarchy Cross-Platform

on:
  push:
    branches: [main, master, summer-2026]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build
        run: go build -v -o omarchy ./...

      - name: Run doctor (version check)
        run: ./omarchy --version

      - name: Test config loading
        run: |
          echo "author: Test User" > ~/.omarchy.yaml
          ./omarchy doctor
