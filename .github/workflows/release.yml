name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build binaries
        run: |
          # Linux
          GOOS=linux GOARCH=amd64 go build -o omarchy-linux-amd64
          # Windows
          GOOS=windows GOARCH=amd64 go build -o omarchy-windows-amd64.exe
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build -o omarchy-darwin-amd64
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -o omarchy-darwin-arm64

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: omarchy-*
