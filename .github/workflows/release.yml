name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: omarchy-windows-amd64.exe
          - os: ubuntu-latest
            output: omarchy-linux-amd64
          - os: macos-latest
            output: omarchy-darwin-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: "1.21"

      - name: Build
        run: go build -o ${{ matrix.output }} -ldflags="-X main.Version=${{ github.ref_name }}"

      - name: Upload
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
