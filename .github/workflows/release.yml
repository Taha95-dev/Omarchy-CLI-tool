name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: omarchy.exe
            asset_name: omarchy-windows-amd64.exe
          - os: ubuntu-latest
            output: omarchy
            asset_name: omarchy-linux-amd64
          - os: macos-latest
            output: omarchy
            asset_name: omarchy-darwin-amd64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        run: go build -o ${{ matrix.output }} -ldflags="-X main.Version=${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            omarchy-windows-amd64/omarchy-windows-amd64.exe
            omarchy-linux-amd64/omarchy-linux-amd64
            omarchy-darwin-amd64/omarchy-darwin-amd64
          draft: false
          prerelease: false
